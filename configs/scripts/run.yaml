# End-to-end left-arm DP versus EMIX experiment matrix.  Run with:
#   python scripts/run.py
#
# `hanging_mug_left_cen_arm_top_cam` is intentionally excluded: its task
# registry marks it frozen/not collectable.  These are the ten active families.
# Per-variant batch runbooks live alongside this file (e.g.
# run_cen_arm_near_side_cam.yaml) and are launched with `run.py --config`.
project:
  robotwin_root: third_party/RoboTwin
  runtime_config_root: configs/scripts/run/{task}
  collection_root: /root/autodl-tmp/sin-v0-patch/data/robotwin/{task}
  dataset_root: /root/autodl-tmp/sin-v0-patch/data/lerobot/{task}
  index_root: /root/autodl-tmp/sin-v0-patch/data/emix_index/{task}
  train_root: /root/autodl-tmp/sin-v0-patch/outputs/train/{task}
  eval_root: /root/autodl-tmp/sin-v0-patch/outputs/eval/{task}
  log_root: /root/autodl-tmp/sin-v0-patch/logs

logging:
  # Roll each worker's log into a new 000-000N.log once a single file exceeds
  # this size, keeping long-running task logs readable.
  rotate_bytes: 52428800  # 50 MiB

environments:
  # auto resolves the Conda root containing emix-twin; an absolute path can
  # still be set when running against a different installation.
  conda_executable: auto
  # CONSTRAINT (do not relax): RoboTwin data collection and policy evaluation
  # MUST run in emix-twin — it is the only env with the vendored curobo /
  # RoboTwin runtime. Data preprocessing and model training MUST run in emix
  # (sm_120-capable torch). Keep these four keys distinct; never fold
  # evaluation back into `training`.
  robotwin: emix-twin      # data collection   (RoboTwin + curobo)
  preprocessing: emix      # data processing   (84x84 convert + emix index)
  training: emix           # model training    (LeRobot diffusion)
  evaluation: emix-twin    # policy evaluation (drives the RoboTwin benchmark env)
  # The twin installer builds OIDN for visible GPU architectures inside one
  # emix-twin environment. scripts/oidn_env.py still detects Blackwell cards
  # to strip stale /usr/local/cuda cuBLASLt from their runtime library path.

pipeline:
  episodes_per_task: 300
  instance_annotations: true
  policies: [baseline, emix, patch]
  image_width: 84
  image_height: 84
  collection_fps: 17
  left_qpos_dim: 7
  evaluation_episodes: 100
  evaluation_seed: 0
  save_evaluation_video: true
  # RoboTwin/Curobo initialization compatibility value. The centered top-camera
  # task moves the idle right articulation to x=5 m after planner setup.
  piper_distance: 0.6

# Post-index visualization: every task with a complete EmixIndex is rendered
# into outputs/intersections/<task>.html and then compiled to a crisp
# outputs/intersections/<task>.png via headless Chrome (non-default: 2x device
# scale, tall window, virtual-time budget, crop-to-content).  Each
# visualization script owns its own outputs/ subfolder; batch pilots driven by
# scripts/assets.py write under outputs/assets_vis/ instead, so batches never
# mix.
visualization:
  output_root: /root/autodl-tmp/sin-v0-patch/outputs/intersections
  camera: isometric          # 3D camera preset (front/top/side/isometric/close)
  window_width: 2400         # Chrome CSS window width for the screenshot
  window_height: 2800        # Chrome CSS window height (tall enough for all three figures)
  device_scale_factor: 2     # hi-DPI scale for crisp text/markers
  virtual_time_budget_ms: 120000  # ms of virtual time to let Plotly/WebGL finish
  png_margin: 24             # device px of white margin kept around content after crop
  chrome_timeout_s: 600      # wall-clock seconds to allow the Chrome render
  # Performance guardrails (always applied by run.py's vis stage):
  max_points: 10000          # cap drawn cross-point groups per HTML (uncapped 500k-group
                             # indexes bloat the file and lag the browser)
  skip_click_images: true    # skip click-to-inspect camera-image precompute (slowest
                             # part of the render; figures in HTML/PNG are unaffected)

training:
  batch_size: 64
  num_workers: 16
  steps: 30000
  save_freq: 5000
  log_freq: 100
  seed: 0
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  optimizer_lr: 0.0001
  horizon: 16
  n_obs_steps: 1
  n_action_steps: 8

emix:
  alpha_mode: beta
  beta: 2
  loss_weight: 1.0
  state_mode: anchor
  scheduler:
    type: logarithmic
    start_batch_prob: 0.6
    end_batch_prob: 0.0

# The flow enforces global phase barriers: all ten tasks collect and convert,
# then the CPU/RAM-intensive EmixIndex queue completes before training and
# evaluation. The default single-GPU queue is serial inside each phase.
gpu_batches:
  # CUDA device 0 works on a one-GPU host. Split tasks into more keys only
  # when more CUDA devices are actually visible. Within-batch order is
  # applied automatically by flow.validate().
  "0":
    - blocks_ranking_rgb_left_cen_arm_top_cam
    - place_burger_fries_left_cen_arm_top_cam
    - place_cans_plasticbox_left_cen_arm_top_cam
    - stack_blocks_two_left_cen_arm_top_cam
    - blocks_ranking_size_left_cen_arm_top_cam
    - place_bread_basket_left_cen_arm_top_cam
    - place_bread_skillet_left_cen_arm_top_cam
    - place_can_basket_left_cen_arm_top_cam
    - place_dual_shoes_left_cen_arm_top_cam
    - stack_bowls_two_left_cen_arm_top_cam
